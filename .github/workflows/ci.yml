name: FailSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression suite (parallel, with retries for flaky tests)
        run: |
          python -m pytest tests/test_regression.py \
            -n auto \
            --json-report --json-report-file=reports/last_run.json \
            -v
        continue-on-error: true

      - name: Run triage classifier
        run: python triage/classify.py reports/last_run.json

      - name: Generate HTML report
        run: python triage/report.py reports/triage_result.json

      - name: Upload triage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: failsense-triage-report
          path: reports/triage_report.html